spring:
  # 本地开发从仓库根的 .env 读取环境变量（Spring Boot 默认不读 .env）。
  # optional: 文件不存在时静默跳过，因此生产环境不受影响。
  # 注意：.env 必须是 LF 换行，否则每个值都会带上 \r。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: analysis-service
  cache:
    type: caffeine
    cache-names: statistics,performance,assetCurve,monthlyProfit,dashboard
    caffeine:
      spec: expireAfterWrite=30s,maximumSize=1000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}


server:
  port: 8083

# 内部服务调用密钥（用于 Feign 调用 auth-service 的 /internal/** 接口）
# 生产环境必须通过环境变量 INTERNAL_KEY 注入强密钥（>= 16 字节）。
# 本地开发可激活 local profile 使用开发密钥（见 application-local.yml）。

spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: none

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Feign 熔断：熔断器负责「何时快速失败」，调用点 try/catch 负责「失败后降级」。
feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      trade-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      data-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      auth-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      trade-service:
        timeout-duration: 10s
      data-service:
        timeout-duration: 10s
      auth-service:
        timeout-duration: 10s

# 服务间共享密钥（Feign 拦截器 / 内部接口）。环境变量 INTERNAL_KEY 不会自动映射到
# fuli.internal-key（relaxed 绑定只认 FULI_INTERNAL_KEY），这里显式接一下；
# 为空时 InternalKeyProperties 的启动校验会快速失败——这两个服务本来就离不开它。
fuli:
  internal-key: ${INTERNAL_KEY:}


# JWT 密钥显式接环境变量。
# 为什么不靠自动绑定：.env 导入的属性源（MapPropertySource）不会把 jwt.secret 翻译成
# JWT_SECRET，只有真正的 OS 环境变量才会；显式接一下，两种注入方式行为一致。
jwt:
  secret: ${JWT_SECRET:}


---
# 生产（非 local）配置：从 Nacos 导入配置，并默认关闭接口文档。
spring:
  config:
    activate:
      on-profile: "!local"
    import: optional:nacos:${spring.application.name}.yaml?refresh=true

# 生产环境默认关闭 swagger/OpenAPI 文档，需要时设 SWAGGER_ENABLED=true 临时开启。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
