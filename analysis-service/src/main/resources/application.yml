spring:
  application:
    name: analysis-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

server:
  port: 8083

# 内部服务调用密钥（用于 Feign 调用 auth-service 的 /internal/** 接口）
fuli:
  internal-key: ${INTERNAL_KEY:fuli-stock-internal-2025-secure-key}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: basic
