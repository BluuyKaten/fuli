# 本地开发 Profile（analysis-service）
# 使用方式：spring.profiles.active=local
#
# 开发密钥仅用于本地，已通过启动校验（长度满足要求）。
# 生产环境不激活此 profile，必须通过环境变量注入强密钥。

jwt:
  # 本地开发 JWT 密钥（>= 32 字节），与 auth-service 保持一致
  secret: dev-only-jwt-secret-key-please-replace-in-production-0123456789

fuli:
  # 本地开发用随机密钥（>= 16 字节），请勿用于生产。
  internal-key: dev-only-internal-key-0123456789

# 暴露 actuator 端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
