spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

# 测试用 JWT 密钥（>= 32 字节），满足 JwtProperties 启动校验
jwt:
  secret: test-jwt-secret-key-01234567890123456789012345

# 测试用内部服务密钥（>= 16 字节），满足 InternalKeyProperties 启动校验
fuli:
  internal-key: test-internal-key-0123456789

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
