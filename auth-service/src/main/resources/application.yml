spring:
  application:
    name: auth-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

server:
  port: 8081

spring.datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:123456}

spring.data.redis:
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入强密钥（>= 32 字节），禁止依赖默认值。
  # 本地开发可激活 local profile 使用开发密钥。
  secret: ${JWT_SECRET:}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 内部接口调用密钥（用于 /auth/internal/** 接口鉴权）
# 生产环境必须通过环境变量 INTERNAL_KEY 注入强密钥（>= 16 字节）。
fuli:
  internal-key: ${INTERNAL_KEY:}
