spring:
  # 本地开发从仓库根的 .env 读取环境变量（Spring Boot 默认不读 .env）。
  # optional: 文件不存在时静默跳过，因此生产环境不受影响。
  # 注意：.env 必须是 LF 换行，否则每个值都会带上 \r（OKX_CRED_KEK 会因此变成 33 字节而启动失败）。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

server:
  port: 8081

spring.datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://127.0.0.1:3306/auth_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:123456}

spring.data.redis:
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT 与内部服务密钥均通过按需注册机制生效：
#   - 本地开发：激活 local profile（见 application-local.yml）
#   - 生产环境：通过环境变量 JWT_SECRET / INTERNAL_KEY 注入

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# 令牌黑名单：登出后令牌立即失效（依赖 Redis）
fuli:
  # 服务间共享密钥（Feign / 内部接口）。环境变量 INTERNAL_KEY 不会自动映射到
  # fuli.internal-key（relaxed 绑定只认 FULI_INTERNAL_KEY），所以这里显式接一下。
  # 为空时 InternalKeyProperties.validate() 会快速失败——auth-service 本来就离不开它。
  internal-key: ${INTERNAL_KEY:}
  token-blacklist:
    enabled: true
  # 服务账号令牌（ADR-0010 决策 4）。clients 为空 = 没有任何服务能取令牌（fail-closed）。
  # ai-service 的密钥只从环境变量注入，仓库里不出现明文。
  agent:
    token-ttl-seconds: 900          # 15 分钟，客户端需定时刷新
    token-audience: fuli-data       # 必须与 data-service 的 okx.auth.service-token-audience 一致
    clients:
      ai-service:
        secret: ${AI_SERVICE_CLIENT_SECRET:}
        scopes: orders:read
        enabled: true

# JWT 密钥显式接环境变量。
# 为什么不靠自动绑定：.env 导入的属性源（MapPropertySource）不会把 jwt.secret 翻译成
# JWT_SECRET，只有真正的 OS 环境变量才会；显式接一下，两种注入方式行为一致。
jwt:
  secret: ${JWT_SECRET:}


---
# 生产（非 local）配置：从 Nacos 导入配置，并默认关闭接口文档。
spring:
  config:
    activate:
      on-profile: "!local"
    import: optional:nacos:${spring.application.name}.yaml?refresh=true

# 生产环境默认关闭 swagger/OpenAPI 文档，需要时设 SWAGGER_ENABLED=true 临时开启。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
