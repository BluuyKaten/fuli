server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/watchlist/**
          filters:
            - StripPrefix=1
        - id: trade-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/trade/**,/api/stock/**
          filters:
            - StripPrefix=1
        - id: analysis-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analysis/**
          filters:
            - StripPrefix=1
        - id: data-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/data/**
          filters:
            - StripPrefix=1

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters-long}
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
