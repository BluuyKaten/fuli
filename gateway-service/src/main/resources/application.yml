server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

# 路由由 GatewayRouteConfig 统一声明；默认 lb://，local profile 覆盖 fuli.routes.*。

# JWT 密钥通过按需注册机制生效：
#   - 本地开发：激活 local profile（见 application-local.yml）
#   - 生产环境：通过环境变量 JWT_SECRET 注入
# 此处不配置 jwt.*，避免空默认值导致启动校验失败。

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# local 完全使用本地配置；仅其他 profile 从 Nacos 导入配置。
spring:
  config:
    activate:
      on-profile: "!local"
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
