server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/watchlist/**
          filters:
            - StripPrefix=1
        - id: trade-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/trade/**,/api/stock/**
          filters:
            - StripPrefix=1
        - id: analysis-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analysis/**
          filters:
            - StripPrefix=1
        - id: data-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/data/**
          filters:
            - StripPrefix=1

# JWT 密钥通过按需注册机制生效：
#   - 本地开发：激活 local profile（见 application-local.yml）
#   - 生产环境：通过环境变量 JWT_SECRET 注入
# 此处不配置 jwt.*，避免空默认值导致启动校验失败。

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
