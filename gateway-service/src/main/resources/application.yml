server:
  port: 8080

spring:
  # 本地开发从仓库根的 .env 读取环境变量（Spring Boot 默认不读 .env）。
  # optional: 文件不存在时静默跳过，因此生产环境不受影响。
  # 注意：.env 必须是 LF 换行，否则每个值都会带上 \r（OKX_CRED_KEK 会因此变成 33 字节而启动失败）。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

# 路由由 GatewayRouteConfig 统一声明；默认 lb://，local profile 覆盖 fuli.routes.*。

# JWT 密钥通过按需注册机制生效：
#   - 本地开发：激活 local profile（见 application-local.yml）
#   - 生产环境：通过环境变量 JWT_SECRET 注入

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# JWT 密钥显式接环境变量。
# 为什么不靠自动绑定：.env 导入的属性源（MapPropertySource）不会把 jwt.secret 翻译成
# JWT_SECRET，只有真正的 OS 环境变量才会；显式接一下，两种注入方式行为一致。
jwt:
  secret: ${JWT_SECRET:}

# 网关全局限流：已认证请求按 userId，登录/注册按客户端 IP（防爆破），健康检查不限。
fuli:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default:
      replenish-rate: 20     # 令牌/秒（每用户）
      burst-capacity: 60     # 突发容量
    paths:
      /api/auth/login:
        replenish-rate: 1
        burst-capacity: 10
      /api/auth/register:
        replenish-rate: 0.5
        burst-capacity: 5


---
# local 完全使用本地配置；仅其他 profile 从 Nacos 导入配置。
spring:
  config:
    activate:
      on-profile: "!local"
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
