spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP
        refresh-enabled: true
  config:
    import:
      - optional:nacos:${spring.application.name}.yml
