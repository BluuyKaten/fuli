server:
  port: 8082

spring.datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://127.0.0.1:3306/trade_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:123456}

spring:
  # 本地开发从仓库根的 .env 读取环境变量（Spring Boot 默认不读 .env）。
  # optional: 文件不存在时静默跳过，因此生产环境不受影响。
  # 注意：.env 必须是 LF 换行，否则每个值都会带上 \r。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: trade-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
  websocket: {}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 内部服务调用密钥（用于 Feign 调用 auth-service 的 /internal/** 接口）
# 生产环境必须通过环境变量 INTERNAL_KEY 注入强密钥（>= 16 字节）。
# 本地开发可激活 local profile 使用开发密钥（见 application-local.yml）。
fuli:
  # 服务间共享密钥（Feign 拦截器 / 内部接口）。环境变量 INTERNAL_KEY 不会自动映射到
  # fuli.internal-key（relaxed 绑定只认 FULI_INTERNAL_KEY），这里显式接一下。
  internal-key: ${INTERNAL_KEY:}
  # 资金校验失败时的处理策略：
  #   reject  - 默认,资金查询失败时拒绝交易(防透支,推荐)
  #   allow   - 资金查询失败时允许交易(仅用于 auth-service 完全不可用的降级场景)
  cash-validation-fail-strategy: ${CASH_VALIDATION_FAIL_STRATEGY:reject}

# 数据源配置
datasource:
  tushare:
    token: ${TUSHARE_TOKEN:}
    enabled: ${TUSHARE_ENABLED:true}
    rate-limit: 1.0  # 次/秒（保守值，实际 80 次/分钟）
  eastmoney:
    enabled: ${EASTMONEY_ENABLED:true}
    rate-limit: 0.2  # 次/秒

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-40.40logger{39} : %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Feign 熔断与超时：熔断器负责「何时快速失败」，调用点 try/catch 负责「失败后降级」。
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      data-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      auth-service:
        timeout-duration: 5s
      data-service:
        timeout-duration: 5s


# JWT 密钥显式接环境变量。
# 为什么不靠自动绑定：.env 导入的属性源（MapPropertySource）不会把 jwt.secret 翻译成
# JWT_SECRET，只有真正的 OS 环境变量才会；显式接一下，两种注入方式行为一致。
jwt:
  secret: ${JWT_SECRET:}


---
# 生产（非 local）配置：从 Nacos 导入配置，并默认关闭接口文档。
spring:
  config:
    activate:
      on-profile: "!local"
    import: optional:nacos:${spring.application.name}.yaml?refresh=true

# 生产环境默认关闭 swagger/OpenAPI 文档，需要时设 SWAGGER_ENABLED=true 临时开启。
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
