server:
  port: 8082

spring.datasource:
  driver-class-name: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://127.0.0.1:3306/trade_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:123456}

spring:
  application:
    name: trade-service
  config:
    import: optional:nacos:${spring.application.name}.yaml?refresh=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
  websocket: {}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 内部服务调用密钥（用于 Feign 调用 auth-service 的 /internal/** 接口）
# 生产环境必须通过环境变量 INTERNAL_KEY 注入强密钥（>= 16 字节）。
# 本地开发可激活 local profile 使用开发密钥（见 application-local.yml）。
# 此处不配置 fuli.internal-key，避免空默认值导致启动校验失败。
fuli:
  # 资金校验失败时的处理策略：
  #   reject  - 默认,资金查询失败时拒绝交易(防透支,推荐)
  #   allow   - 资金查询失败时允许交易(仅用于 auth-service 完全不可用的降级场景)
  cash-validation-fail-strategy: ${CASH_VALIDATION_FAIL_STRATEGY:reject}

# 数据源配置
datasource:
  tushare:
    token: ${TUSHARE_TOKEN:}
    enabled: ${TUSHARE_ENABLED:true}
    rate-limit: 1.0  # 次/秒（保守值，实际 80 次/分钟）
  eastmoney:
    enabled: ${EASTMONEY_ENABLED:true}
    rate-limit: 0.2  # 次/秒
