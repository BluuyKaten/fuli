spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    openfeign:
      client:
        config:
          authFeignClient:
            url: http://localhost:8081
          dataFeignClient:
            url: http://localhost:8084

# 本地开发 Profile（trade-service）
# 使用方式：spring.profiles.active=local
#
# 开发密钥仅用于本地，已通过启动校验（长度满足要求）。
# 生产环境不激活此 profile，必须通过环境变量注入强密钥。

jwt:
  # 本地开发 JWT 密钥（>= 32 字节），与 auth-service 保持一致
  secret: ${JWT_SECRET:dev-only-jwt-secret-key-please-replace-in-production-0123456789}

# 大智慧量化排行本机采集配置，导出目录按实际安装路径调整。
quant-ranking:
  collector:
    export-dir: ${DZH_EXPORT_DIR:}
  holidays: ${QUANT_RANKING_HOLIDAYS:}

fuli:
  # 本地开发用随机密钥（>= 16 字节），请勿用于生产。
  internal-key: ${INTERNAL_KEY:dev-only-internal-key-0123456789}

# 本地开发保留 SQL 日志；生产环境使用默认 slf4j 实现（不打印 SQL）。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
